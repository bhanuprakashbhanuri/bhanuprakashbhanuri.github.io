name: Build, verify and deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Show dist contents (for verification)
        run: |
          echo "=== dist tree ==="
          ls -la dist || true
          echo "=== head of dist/index.html ==="
          sed -n '1,120p' dist/index.html || true

      - name: Upload dist as artifact (optional debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-for-debug
          path: dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
